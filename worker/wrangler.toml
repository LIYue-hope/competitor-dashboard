# 竞品看板「数据更新」按钮的 Serverless 代理配置。
# 部署：npx wrangler deploy（在 worker/ 目录下执行）
name = "competitor-dashboard-refresh"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# 非敏感配置，明文放这里即可。改成自己的仓库和站点来源。
REPO = "LIYue-hope/competitor-dashboard"
ALLOWED_ORIGIN = "https://liyue-hope.github.io"

# 敏感值不要写进本文件（会进 git），用 wrangler secret 单独设置：
#   npx wrangler secret put GITHUB_TOKEN   # fine-grained PAT，权限仅 Actions: read and write
#   npx wrangler secret put REFRESH_KEY    # 前端访问口令，自己生成一串随机字符串

# 服务端冷却依赖 KV。不绑定 Worker 也能跑，但那时只剩前端 localStorage 冷却，
# 清一下浏览器数据就能绕过，等于把 CI 额度开放给公网，建议务必绑上：
#   npx wrangler kv namespace create REFRESH_STATE
# 把命令输出的 id 填到下面并取消注释。
# [[kv_namespaces]]
# binding = "STATE"
# id = "在这里填 wrangler 输出的 namespace id"
