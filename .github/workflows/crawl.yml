name: 竞品数据采集

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# 避免同一分支上出现并发运行的 workflow 互相推送冲突。
# cancel-in-progress: false 表示排队等待前一个采集任务跑完，而不是中途取消，
# 这样每次触发（定时+手动）都会依次完整执行，最大化数据完整性。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 注册 merge=ours 驱动（配合 .gitattributes 避免数据文件产生冲突）
        # .gitattributes 声明 data/*.json merge=ours，但 Git 并不会内置这个
        # 驱动，需要显式注册一次（值随便设为 true，Git 只关心该 config key
        # 是否存在），否则该属性不生效，冲突时仍会走默认三方合并。
        run: git config --local merge.ours.driver true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 运行 TapTap 采集脚本
        run: python scripts/crawl_taptap.py

      - name: 运行热门游戏动态采集脚本
        run: python scripts/crawl_hot_games.py

      - name: 采集失败提示
        # 单独一步作为"哨兵"：放在采集脚本之后、提交步骤之前，只有前面任一
        # 脚本步骤失败（exit 非 0）才会触发，输出一条 GitHub Actions 错误
        # 注解，方便在 Actions 列表页/邮件通知里一眼看到失败原因，不必展开
        # 日志逐行查找。注意该步骤本身不应改变 job 的失败状态，仅做提示。
        if: failure()
        run: echo "::error::竞品数据采集失败，请检查上方步骤日志"

      - name: 提交并推送数据变更
        # 不用 stefanzweifel/git-auto-commit-action：该 action 内部自己做
        # add+commit+push，push 失败（non-fast-forward）时无法从外部介入重试，
        # 且没有 skip_push 输入可用于把 push 拆出来单独处理。改为直接用原生
        # git 命令，方便在推送冲突时精确控制重试与冲突解决策略。
        #
        # data/*.json 是纯采集生成产物（.gitattributes 已声明
        # merge=ours，避免 rebase 时进入需要人工解决的冲突状态），
        # 因此这里冲突处理只需保底兜底一次 checkout --ours。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/*.json; then
            echo "数据无变化，跳过提交"
            exit 0
          fi

          git add data/*.json
          git commit -m "chore: 更新竞品监测数据（TapTap / 热门游戏动态）"

          for i in 1 2 3; do
            if git push origin ${{ github.ref_name }}; then
              exit 0
            fi
            echo "推送冲突，尝试第 $i 次 rebase 重试..."
            if ! git pull --rebase origin ${{ github.ref_name }}; then
              echo "rebase 冲突，data/*.json 以本次采集结果为准"
              git checkout --ours -- data/*.json
              git add data/*.json
              git rebase --continue
            fi
          done
          git push origin ${{ github.ref_name }}

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout 仓库
        # crawl job 通过 needs 保证先执行完成，git-auto-commit-action 的提交
        # 已经推送到默认分支，这里普通 checkout 即可拉到包含最新数据的代码。
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 构建展示层
        # vite.config.js 中的 closeBundle 钩子会在构建完成后自动把仓库根目录
        # data/ 拷贝进 web/dist/data/，因此构建产物已包含最新采集数据。
        working-directory: web
        run: npm run build

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

