name: 竞品数据采集

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# 避免同一分支上出现并发运行的 workflow 互相推送冲突。
# cancel-in-progress: false 表示排队等待前一个采集任务跑完，而不是中途取消，
# 这样每次触发（定时+手动）都会依次完整执行，最大化数据完整性。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 运行 TapTap 采集脚本
        run: python scripts/crawl_taptap.py

      - name: 运行热门游戏动态采集脚本
        run: python scripts/crawl_hot_games.py

      - name: 提交数据变更
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: 更新竞品监测数据（TapTap / 热门游戏动态）'
          file_pattern: 'data/*.json'
          skip_push: true

      - name: 推送提交（遇冲突时以本次采集结果为准，rebase 后重试）
        # 不在 commit 前做 pull --rebase --autostash：那一步会把脚本刚生成的
        # 未提交改动 stash 再 pop，如果远程同时更新了同一批 data/*.json，
        # pop 会冲突并把工作区留在"未合并"状态，导致后面 git add 直接报错
        # （即 "needs merge" -> Invalid status code: 1）。
        # 改为：先正常提交，push 失败（non-fast-forward）时才 rebase；
        # data/*.json 是纯采集生成产物，冲突时直接以本次最新采集结果为准
        # (--ours)，不做人工合并。
        if: steps.auto_commit.outputs.changes_detected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            if git push origin ${{ github.ref_name }}; then
              exit 0
            fi
            echo "推送冲突，尝试第 $i 次 rebase 重试..."
            if ! git pull --rebase origin ${{ github.ref_name }}; then
              echo "rebase 冲突，data/*.json 以本次采集结果为准"
              git checkout --ours -- data/*.json
              git add data/*.json
              git rebase --continue
            fi
          done
          git push origin ${{ github.ref_name }}

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout 仓库
        # crawl job 通过 needs 保证先执行完成，git-auto-commit-action 的提交
        # 已经推送到默认分支，这里普通 checkout 即可拉到包含最新数据的代码。
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 构建展示层
        # vite.config.js 中的 closeBundle 钩子会在构建完成后自动把仓库根目录
        # data/ 拷贝进 web/dist/data/，因此构建产物已包含最新采集数据。
        working-directory: web
        run: npm run build

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

